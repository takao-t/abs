;各種サブルーチン
; 注意:テクノロジは大文字にすること(PJSIPやWEBSOCKET)

;CID(番号)から名前を取得するサブルーチン
;AstDBのcidnameに番号と名前を入れておくこと
[sub-cidnamecheck]

exten => s,1,NoOp(CID参照サブルーチン)
exten => s,n,GotoIf($["${DB(ABS/CTI/CIDREF)}"!="SCRM"]?useastdb)
;簡単CRM参照
exten => s,n,Set(CIDNAME=${SHELL(php /var/lib/asterisk/scripts/get_cidname_from_db.php ${CALLERID(num)})})
exten => s,n,Goto(setnext)
;AstDB参照
exten => s,n(useastdb),Set(CIDNAME=${DB(cidname/${CALLERID(num)})})
exten => s,n(setnext),GotoIf($["${CIDNAME}" = ""]?noname)
exten => s,n,Set(CALLERID(name)=${CIDNAME})
exten => s,n,Set(CCIDNUM=${CALLERID(num)})
exten => s,n,Set(CCIDNAME=${CIDNAME})
exten => s,n,Goto(endsub)
exten => s,n(noname),Set(CALLERID(name)=${CALLERID(num)})
exten => s,n,Set(CCIDNUM=${CALLERID(num)})
exten => s,n,Set(CCIDNAME=${CALLERID(name)})
exten => s,n(endsub),NoOp
exten => s,n(skipl),Return

;DBに値が設定されている場合に回線側のCIDを設定するサブルーチン
;引数ARG1はKIDのこと
[sub-forcecid]
exten => s,1,NoOp(CID強制設定)
exten => s,n,Set(TMPCID=${DB(KEYTEL/KEYSYS${ARG1}/OGCID)})
exten => s,n,GotoIf($["${TMPCID}"=""]?done)
exten => s,n,Set(CALLERID(num)=${TMPCID})
exten => s,n,Set(OGCID=${TMPCID})
exten => s,n(done),Return

;テクノロジにかかわらずエンドポイント名取得サブルーチン
[sub-getendpointname]
exten => s,1,NoOp(内線エンドポイント名取得)
;エンドポイントのオーバライド設定がある場合にはそれを使用する
exten => s,n,GotoIf($["${ENDPOINTOVERRIDE}"!=""]?doc2)
exten => s,n,GotoIf($["${CHANNEL(channeltype)}"="WebSocket"]?wsendpoint)
exten => s,n,Set(MENDPOINT=${CHANNEL(name)})
;チャネル名のハイフンから前の部分がテクノロジを含むエンドポイント名
exten => s,n,Set(MENDPOINT=${CUT(MENDPOINT,-,1)})
exten => s,n,GotoIf($["${MENDPOINT}"!=""]?doc)
exten => s,n,Set(MENDPOINT=${CHANNEL(endpoint)})
exten => s,n(doc),Return
exten => s,n(doc2),Set(MENDPOINT=${ENDPOINTOVERRIDE})
exten => s,n,Return
;Websocketの場合CHANNEL変数から取れないのでチャネル名から取得
exten => s,n(wsendpoint),NoOp(WS)
exten => s,n,Set(TMP_ENDPOINT=${CHANNEL(name)})
exten => s,n,Set(MENDPOINT=${CUT(TMP_ENDPOINT,/,2-)})
exten => s,n,Return

;チャンネルタイプ取得サブルーチン
[sub-getchantype]
exten => s,1,NoOp(チャンネルタイプ取得)
;エンドポイントのオーバライド設定の場合
exten => s,n,GotoIf($["${ENDPOINTOVERRIDE}"!=""]?fixt)
exten => s,n,Set(CHANTYPE=${CHANNEL(channeltype)})
exten => s,n,Return
;オーバライドされている場合には内線TECHを使う
exten => s,n(fixt),Set(CHANTYPE=${DB(ABS/EXTTECH)})
exten => s,n,Return

;内線番号からエンドポイント名取得サブルーチン
;入力: EXT
;返値: ENDPOINT (PJSIPのDialコンタクトのフル形式)
;返値: sENDPOINT (ショート形式 PJSIP/phone1のみ)
[sub-ext2endpoint]
exten => s,1,NoOp(内線番号からエンドポイント取得)
exten => s,n,Set(ENDPOINT=${DB(ABS/EXT/${EXT})})
;エンドポイントが取得できない場合は復帰
exten => s,n,GotoIf($["${ENDPOINT}"=""]?done)
;G指定されている場合にはグループ
exten => s,n,GotoIf($["${ENDPOINT:0:1}"="G"]?done)
;R指定されている場合にはリモート内線
exten => s,n,GotoIf($["${ENDPOINT:0:1}"="R"]?done)
;テクノロジがWEBSOCKETなら別処理
exten => s,n,GotoIf($["${ENDPOINT:0:3}"="WEB"]?wsp)
;WIP:PJSIPの場合にテクノロジ削除
exten => s,n,Set(sENDPOINT=${ENDPOINT})
exten => s,n,Set(ENDPOINT=${CUT(ENDPOINT,/,2)})
;PJSIPのダイヤルコンタクトに変換
exten => s,n,Set(ENDPOINT=${PJSIP_DIAL_CONTACTS(${ENDPOINT},${ENDPOINT})})
;返値の先頭テクノロジ部分削除(ABS自体が付けるため)
;exten => s,n,Set(ENDPOINT=${CUT(ENDPOINT,/,2-)})
exten => s,n(done),Return
;Websocketの場合のDial文字列生成
exten => s,n(wsp),NoOp
exten => s,n,Set(WSOPT=${DB(ABS/WSP/DARG)})
exten => s,n,Set(ENDPOINT=${ENDPOINT}/${WSOPT})
exten => s,n(wspret),Return

;エンドポイント名から内線番号取得サブルーチン
;入力: ENDPOINT
;返値: EXT
[sub-endpoint2ext]
exten => s,1,NoOp(エンドポイント名から内線番号取得)
exten => s,n,NoOp(${ENDPOINT})
exten => s,n,Set(EXT=${DB(ABS/ERV/${ENDPOINT})})
exten => s,n,GotoIf($["${EXT}"=""]?tryagain)
exten => s,n,Return
;ERVがテクノロジ付(PJSIP)の場合にはこちらを使用
exten => s,n(tryagain),NoOp
exten => s,n,Set(EXT=${DB(ABS/ERV/PJSIP/${ENDPOINT})})
exten => s,n,Return

;内線登録されていない端末は切断するサブルーチン
[sub-extcheck]
exten => s,1,NoOp(内線登録確認)
exten => s,n,Gosub(sub-getendpointname,s,1)
exten => s,n,Set(EXT=${DB(ABS/ERV/${MENDPOINT})})
exten => s,n,GotoIf($["${EXT}"=""]?nogo)
exten => s,n,Set(ENDPOINT=${DB(ABS/EXT/${EXT})})
exten => s,n,GotoIf($["${ENDPOINT}"=""]?nogo)
exten => s,n(nochk),Return
;内線登録がない場合には強制切断
exten => s,n(nogo),NoOp(内線登録なしまたはエラー)
exten => s,n(hngext),Hangup

;自端末情報を変数に設定するサブルーチン
[sub-whoami]
exten => s,1,NoOp(自端末情報取得)
exten => s,n,Gosub(sub-getendpointname,s,1)
exten => s,n,Set(ME=${DB(ABS/ERV/${MENDPOINT})})
exten => s,n,Set(OGCID=${DB(ABS/EXT/${ME}/OGCID)})
exten => s,n,Return

;*56系ダイヤルチェック
[sub-d56check]
exten => s,1,NoOp(D56チェック)
exten => s,n,Set(TMP=${DB(ABS/D56)})
exten => s,n,GotoIf($["${TMP}"!="1"]?nogo)
exten => s,n,Return
;*56発信が禁止されている場合には強制切断
exten => s,n(nogo),NoOp(*56発信禁止中)
exten => s,n,Hangup

;規制情報チェック
;引数:要求レベル
[sub-chkrestrict]
;発信規制情報取得
exten => s,1,NoOp(規制情報チェック)
;C2C発信時に規制値チェックしない
exten => s,n,GotoIf($["${C2COUT}"="YESC2C"]?togo)
exten => s,n,GoSub(sub-getendpointname,s,1)
exten => s,n,Set(TMP=${MENDPOINT})
exten => s,n,GotoIf($["${TMP}"!=""]?doc)
exten => s,n,Set(TMP=${CHANNEL(endpoint)})
exten => s,n(doc),Set(LMT=${DB(ABS/LMT/${TMP})})
exten => s,n,GotoIf($["${LMT}"=""]?nogo)
;規制値でジャンプさせる
exten => s,n,GotoIf($[${LMT} >= ${ARG1}]?togo)
;指定された規制値以外ならダイヤルしない
exten => s,n(nogo),Congestion
;規制値が正当ならサブルーチン終了
exten => s,n(togo),Return

;アカウントコードチェック
[sub-acccheck]
exten => s,1,NoOp(アカウントコードチェック)
exten => s,n,GotoIf($["${DB(ABS/ACC)}"="1"]?chknxt)
exten => s,n,Return
exten => s,n(chknxt),Set(ACCP=${CDR(accountcode)})
exten => s,n,Set(ACCX=${DB(ABS/ACO)})
exten => s,n,GotoIf($["${ACCP}"!="${ACCX}"]?nogo)
exten => s,n,Return
exten => s,n(nogo),Congestion

;グループダイヤルサブルーチンへのエントリ
[sub-groupdial]
exten => s,1,NoOp(グループ呼び出し GRP=${ARG1} FROM=${ARG2})
exten => s,n,NoOp(${RGPT})
;方式取得
exten => s,n,Set(MET=${DB(ABS/GRP/${ARG1}/MET)})
exten => s,n,GotoIf($["${MET}"="RR"]?grr)
exten => s,n,GotoIf($["${MET}"="RM"]?grm)
exten => s,n(gra),Gosub(sub-groupdial-ra,s,1(${ARG1},${ARG2}))
exten => s,n,Hangup
exten => s,n(grr),Gosub(sub-groupdial-rr,s,1(${ARG1},${ARG2}))
exten => s,n,Hangup
exten => s,n(grm),Gosub(sub-groupdial-rm,s,1(${ARG1},${ARG2}))
exten => s,n,Hangup


;グループダイヤル:一斉鳴動
; ARG1: グループ番号
; ARG2: From(内線orキー)
[sub-groupdial-ra]
exten => s,1,NoOp(グループ呼び出し GRP=${ARG1} FROM=${ARG2})
;グループ番号とFROMをセット
exten => s,n,Set(GRP=${ARG1})
exten => s,n,Set(FROM=${ARG2})
;DBからグループ内の内線リストを取得
exten => s,n,Set(GLST=${DB(ABS/GRP/${GRP})})
;空なら何もしない
exten => s,n,GotoIf($["${GLST}"=""]?donothing)
;内線リストからエンドポイントのリスト組み立て
exten => s,n,Set(i=1)
exten => s,n,Set(TGT="")
exten => s,n,While($[${i}<32])
exten => s,n,Set(TMP=${CUT(GLST,\,,${i})})
exten => s,n,GotoIf($["${TMP}"=""]?dodial)
exten => s,n,Set(EXT=${TMP})
exten => s,n,Gosub(sub-ext2endpoint,s,1)
exten => s,n,GotoIf($["${ENDPOINT}"=""]?trynxt)
;割り込みオーバライドが設定されている場合にはエンドポイントの話中をチェックしない
exten => s,n,GotoIf($["${DB(ABS/GRP/${GRP}/OVR)}"="1"]?addp)
;該当エンドポイントが使用中のチャネルを持つ場合には対象に入れない
;ENDPOINTがDial ContactになっているのでTECH/ENDPOINTを取り出し
exten => s,n,Set(TMP_TECH=${CUT(ENDPOINT,/,1)})
exten => s,n,Set(TMP_ENDP=${CUT(ENDPOINT,/,2)})
exten => s,n,GotoIf($["${CHANNELS(${TEMP_TECH}/${TMP_ENDP}-*)}"!=""]?trynxt)
;exten => s,n(addp),Set(TGT=${TGT}&${ENDPOINT})
exten => s,n(addp),Set(TGT=${TGT}&${ENDPOINT})
exten => s,n(trynxt),Set(i=$[${i}+1])
exten => s,n,EndWhile
;リスト整形
exten => s,n(dodial),Set(TGT=${TGT:3})
;ダイヤル先がまったくない場合の処理
exten => s,n,GotoIf($["${TGT}"=""]?dobusy)
;ダイヤルオプション取得
exten => s,n,Set(OPT=${DB(ABS/GRP/OPT)})
;タイムアウト取得
exten => s,n,Set(TMO=${DB(ABS/GRP/TMO)})
;キーシステムかどうかを判別
exten => s,n(doagain),GotoIf($["${FROM}"=""]?notkeysys)
exten => s,n,GotoIf($["${FROM}"="0"]?notkeysys)
;キーシステムでの着信ならサブルーチン実行
;キー着信時の通知指示をmarkmeに行わせる(ARG2)
exten => s,n,NoOp(${INCID})
exten => s,n,Dial(${TGT},${TMO},rU(sub-markme^${FROM}^KEYIN)b(multi-subs^s^1(selfpark-handler,s,sub-setringpattern,${RGPT}))x${OPT})
;ダイヤル結果によってループ待機
exten => s,n,GotoIf($["${DB(ABS/GRP/${GRP}/BNL)}"!="1"]?dobusy)
exten => s,n,GotoIf($["${DIALSTATUS}"="BUSY"]?waitloop)
exten => s,n,GotoIf($["${DIALSTATUS}"="NOANSWER"]?waitloop)
exten => s,n,GotoIf($["${DIALSTATUS}"="CHANUNAVAIL"]?waitloop)
exten => s,n,Goto(dobusy)
;キーシステムではない着信ならキーサブルーチンなし
exten => s,n(notkeysys),Dial(${TGT},${TMO},rU(sub-notify-check^${INCID}^GRP)b(selfpark-handler^s^1)x${OPT})
;ダイヤル結果によってループ待機
exten => s,n,GotoIf($["${DB(ABS/GRP/${GRP}/BNL)}"!="1"]?dobusy)
exten => s,n,GotoIf($["${DIALSTATUS}"="BUSY"]?waitloop)
exten => s,n,GotoIf($["${DIALSTATUS}"="NOANSWER"]?waitloop)
exten => s,n,GotoIf($["${DIALSTATUS}"="CHANUNAVAIL"]?waitloop)
exten => s,n,Goto(donothing)
exten => s,n(dobusy),Busy
exten => s,n(donothing),Return
;グループ一斉鳴動時の待機ループ有時の処理
exten => s,n(waitloop),NoOp(一斉鳴動待機ループ)
;待機時間取得
exten => s,n,Set(BTO=${DB(ABS/GRP/${GRP}/BNT)})
exten => s,n,GotoIf($["${BTO}"!=""]?doring)
exten => s,n,Set(BTO=3)
exten => s,n(doring),Ringing()
exten => s,n,Wait(${BTO})
exten => s,n,Goto(doagain)

;グループダイヤル:順次鳴動
; ARG1: グループ番号
; ARG2: From(内線orキー)
[sub-groupdial-rr]
exten => s,1,NoOp(グループ呼び出し GRP=${ARG1} FROM=${ARG2})
;グループ番号とFROMをセット
exten => s,n,Set(GRP=${ARG1})
exten => s,n,Set(FROM=${ARG2})
;DBからグループ内の内線リストを取得
exten => s,n,Set(GLST=${DB(ABS/GRP/${GRP})})
;空なら何もしない
exten => s,n,GotoIf($["${GLST}"=""]?donothing)
;タイムアウト取得
exten => s,n,Set(TMO=${DB(ABS/GRP/${ARG1}/TMO)})
exten => s,n,GotoIf($["${TMO}"!=""]?doagain)
exten => s,n,Set(TMO=20)
;ループ初期値
exten => s,n(doagain),NoOp
exten => s,n,Set(i=1)
exten => s,n,Set(RNUM=0)
;ここから処理ループ
exten => s,n,While($[${i}<32])
exten => s,n,Set(EXT=${CUT(GLST,\,,${i})})
exten => s,n,GotoIf($["${EXT}"!=""]?gendpoint)
;このサイクルでダイヤルした相手がゼロなら5秒待機
exten => s,n,GotoIf($["${RNUM}"!="0"]?doagain)
exten => s,n,Wait(5)
exten => s,n,Goto(doagain)
;ダイヤル処理へ
exten => s,n(gendpoint),Gosub(sub-ext2endpoint,s,1)
exten => s,n,GotoIf($["${ENDPOINT}"=""]?trynxt)
;割り込みオーバライドが設定されている場合にはエンドポイントの話中をチェックしない
exten => s,n,GotoIf($["${DB(ABS/GRP/OVR)}"="1"]?addp)
;該当エンドポイントが使用中のチャネルを持つ場合には呼ばない
exten => s,n,Set(TMP_TECH=${CUT(ENDPOINT,/,1)})
exten => s,n,Set(TMP_ENDP=${CUT(ENDPOINT,/,2)})
exten => s,n,GotoIf($["${CHANNELS(${TMP_TECH}/${TMP_ENDP}-*)}"!=""]?trynxt)
;ダイヤルオプション取得
exten => s,n(addp),Set(OPT=${DB(ABS/GRP/OPT)})
;キーシステムかどうかを判別
exten => s,n,GotoIf($["${FROM}"=""]?dodial)
exten => s,n,GotoIf($["${FROM}"="0"]?dodial)
;キーシステムでの着信ならサブルーチン設定
exten => s,n,Set(KSUBR=U(sub-markme^${FROM}))
exten => s,n(dodial),NoOp
exten => s,n,Dial(${ENDPOINT},${TMO},U(sub-notify-check^${INCID}^GRP)b(sub-setringpattern,${RGPT},1)x${OPT}${KSUBR})
exten => s,n,Set(RNUM=$[${RNUM}+1])
exten => s,n(trynxt),Set(i=$[${i}+1])
exten => s,n,EndWhile
exten => s,n(donothing),Return


;グループダイヤル:順次鳴動メモリあり
; ARG1: グループ番号
; ARG2: From(内線orキー)
[sub-groupdial-rm]
exten => s,1,NoOp(グループ呼び出し GRP=${ARG1} FROM=${ARG2})
;グループ番号とFROMをセット
exten => s,n,Set(GRP=${ARG1})
exten => s,n,Set(FROM=${ARG2})
;DBからグループ内の内線リストを取得
exten => s,n,Set(GLST=${DB(ABS/GRP/${GRP})})
;空なら何もしない
exten => s,n,GotoIf($["${GLST}"=""]?donothing)
;タイムアウト取得
exten => s,n,Set(TMO=${DB(ABS/GRP/${ARG1}/TMO)})
exten => s,n,GotoIf($["${TMO}"!=""]?chknn)
exten => s,n,Set(TMO=20)
;前回コール位置をDBから取得
exten => s,n(chknn),Set(i=${DB(ABS/GRP/${GRP}/LAST)})
exten => s,n,GotoIf($["${i}"!=""]?rment)
exten => s,n,Goto(doagain)
exten => s,n,Goto(rment)

;ループ初期値
exten => s,n(doagain),NoOp
exten => s,n,Set(i=1)
;前回コール位置からの再開はここへジャンプ
exten => s,n(rment),Set(RNUM=0)
;ここから処理ループ
exten => s,n,While($[${i}<32])
exten => s,n,Set(EXT=${CUT(GLST,\,,${i})})
exten => s,n,GotoIf($["${EXT}"!=""]?gendpoint)
;このサイクルでダイヤルした相手がゼロなら5秒待機
exten => s,n,GotoIf($["${RNUM}"!="0"]?doagain)
exten => s,n,Wait(5)
exten => s,n,Goto(doagain)
;ダイヤル処理へ
exten => s,n(gendpoint),Gosub(sub-ext2endpoint,s,1)
exten => s,n,GotoIf($["${ENDPOINT}"=""]?trynxt)
;割り込みオーバライドが設定されている場合にはエンドポイントの話中をチェックしない
exten => s,n,GotoIf($["${DB(ABS/GRP/OVR)}"="1"]?addp)
;該当エンドポイントが使用中のチャネルを持つ場合には呼ばない
exten => s,n,GotoIf($["${CHANNELS(${ENDPOINT}-*)}"!=""]?trynxt)
;ダイヤルオプション取得
exten => s,n(addp),Set(OPT=${DB(ABS/GRP/OPT)})
;キーシステムかどうかを判別
exten => s,n,GotoIf($["${FROM}"=""]?dodial)
exten => s,n,GotoIf($["${FROM}"="0"]?dodial)
;キーシステムでの着信ならサブルーチン設定
exten => s,n,Set(KSUBR=U(sub-markme^${FROM}))
exten => s,n(dodial),NoOp
exten => s,n,Set(DB(ABS/GRP/${GRP}/LAST)=$[${i}+1])
exten => s,n,Dial(${ENDPOINT},${TMO},U(sub-notify-check^${INCID}^GRP)b(sub-setringpattern,${RGPT},1)x${OPT}${KSUBR})
exten => s,n,Set(RNUM=$[${RNUM}+1])
exten => s,n(trynxt),Set(i=$[${i}+1])
exten => s,n,EndWhile
exten => s,n(donothing),Return

;AquesTalkPiによる音声合成用サブルーチン
[sub-AquesTalkPi]
exten => s,1,NoOp(AquesTalkPi)
exten => s,n,Set(ID=${CHANNEL})
exten => s,n,Set(FN=${CUT(ID,/,2)})
exten => s,n,Set(FN=/tmp/${FN})
exten => s,n,Set(CHANNEL(hangup_handler_push)=atp-rm-hdlr,s,1(${FN}));
exten => s,n,System(/usr/lib/asterisk/atp/AquesTalkPi ${ARG1} > ${FN}.wav)
exten => s,n(loop),Playback(${FN})
exten => s,n,GotoIf($["${PLAYBACKSTATUS}"="FAILED"]?endm)
exten => s,n,System(rm -f ${FN}.wav)
exten => s,n(endm),Set(CHANNEL(hangup_handler_pop)=);
exten => s,n,Return

;AquesTalkPi ファイル削除用ハンドラ
[atp-rm-hdlr]
exten => s,1,System(rm -f ${ARG1}.wav)
exten => s,n,Return()

;AudioSocketデバッグ用情報削除ハンドラ
[as-rm-db-hdlr]
exten => s,1,NoOp(DBエントリ削除${ARG1})
exten => s,n,Set(DB_DELETE(BY-UUID/${ARG1})=ignored)
exten => s,n,Return

[debug-hdlr]
exten => s,1,DumpChan()
exten => s,n,Return()

;コールパーク時呼び戻し時間取得
[get-parktime]
exten => s,1,NoOp
exten => s,n,Set(CPBT=${DB(ABS/CPBT)})
exten => s,n,GotoIf($["${CPBT}"!=""]?ends)
exten => s,n,Set(CPBT=60)
exten => s,n(ends),Return
;セルフパーク時呼び戻し時間取得
[get-sfptime]
exten => s,1,NoOp
exten => s,n,Set(SPBT=${DB(ABS/SPBT)})
exten => s,n,GotoIf($["${SPBT}"!=""]?ends)
exten => s,n,Set(SPBT=60)
exten => s,n(ends),Return

;休日判定サブルーチン
[sub-CHKHOLIDAY]
exten => s,1,NoOp(休日判定)
exten => s,n,Set(HOLIDAY="")
exten => s,n,Set(TODAY=${STRFTIME(,,%Y-%m-%d)})
exten => s,n,Set(WDAY=${STRFTIME(,,%a)})
exten => s,n,Set(HOLIDAY=${DB(HOLIDAYS/JAPAN/${TODAY})})
exten => s,n,GotoIf($["${HOLIDAY}" != ""]?endm)
;曜日チェック
exten => s,n,GotoIf($["${DB(HOLIDAYS/${WDAY})}" = "1"]?swday)
;曜日該当しない
exten => s,n,Goto(endm)
;曜日チェック時は結果に曜日をセット
exten => s,n(swday),Set(HOLIDAY=${WDAY})
;サブルーチン終了
exten => s,n(endm),NoOp(${HOLIDAY})
exten => s,n,Return

;外部サービス連携(着信通知)
; ARG1: 着信時発信者番号(外線)
; ARG2: 着信先内線番号
;       指定がない場合にはall
[external-notify]
exten => s,1,NoOp(着信通知連携)
exten => s,n,NoOp(${ARG1})
exten => s,n,NoOp(${ARG2})
exten => s,n,GotoIf($["${ARG2}"!=""]?isarg2)
exten => s,n,Set(ARG2=all)
exten => s,n(isarg2),Set(TOKEN=${DB(ABS/CTI/TOKEN)})
exten => s,n,Set(TPORT=${DB(ABS/CTI/TPORT)})
exten => s,n,GotoIf($["${TOKEN}"=""]?nonotify)
exten => s,n,GotoIf($["${TPORT}"=""]?nonotify)
exten => s,n,System(curl -X POST "http://localhost:${TPORT}/api/trigger?phone=${ARG1}&exten=${ARG2}&token=${TOKEN}" -m 1)
exten => s,n(nonotify),Return

;Slackサンプルが以下
;exten => s,n,Set(TMP_CIDNAME=${DB(cidname/${ARG1})})
;exten => s,n,GotoIf($["${TMP_CIDNAME}" = ""]?noname)
;exten => s,n,Goto(do_slack)
;exten => s,n(noname),Set(TMP_CIDNAME=${ARG1})
;exten => s,n(do_slack),System(python3 /var/lib/asterisk/slack-notify.py ${ARG1} ${TMP_CIDNAME})
;exten => s,n,Return

;自己保留(セルフパーク)
[selfpark]
exten => sfp,1,NoOp
exten => sfp,n,GoSub(sub-whoami,s,1)
;exten => sfp,n,DumpChan()
exten => sfp,n,Set(TMPEXT=${CONNECTEDLINE(num)})
exten => sfp,n,GotoIf($["${TMPEXT}"!="s"]?skips)
exten => sfp,n,Set(TMPEXT=)
exten => sfp,n(skips),Set(SFPCENDPOINT=${DB(ABS/EXT/${TMPEXT})})
exten => sfp,n,Set(MTARGET=${TMPEXT})
exten => sfp,n,GotoIf($["${SFPCENDPOINT}"!=""]?dopark)
exten => sfp,n,Set(SFPCENDPOINT=${DB(ABS/ERV/${TMPEXT})})
exten => sfp,n,GotoIf($["${SFPCENDPOINT}"!=""]?doparkp)
exten => sfp,n,Set(SFTMP=${BLINDTRANSFER})
exten => sfp,n,Set(SFTMP=${CUT(SFTMP,/,2)})
exten => sfp,n,Set(SFTMP=${CUT(SFTMP,-,1)})
exten => sfp,n,GotoIf($["${SFTMP}"=""]?nogo)
exten => sfp,n,Set(SFPCENDPOINT=${SFTMP})
exten => sfp,n,Set(MTARGET=${SFTMP})
exten => sfp,n,Goto(dopark)
exten => sfp,n(doparkp),NoOp
exten => sfp,n,Set(MTARGET=${TMPEXT})
exten => sfp,n,Set(SFPCENDPOINT=${TMPEXT})
exten => sfp,n(dopark),Set(PARKINGLOT=${SFPCENDPOINT})
exten => sfp,n,GoSub(get-sfptime,s,1)
exten => sfp,n,Park(,st(${SPBT}))
exten => sfp,n(nogo),NoOp()

;セルフパーク用ハンドラ(Dialでコール)
[selfpark-handler]
exten => s,1,NoOp
exten => s,n,Set(DYNAMIC_FEATURES=selfpark)
exten => s,n,Return
;セルフパーク・タイムアウト戻り
[selfptimedout]
exten => s,1,NoOp
exten => s,n,Set(CALLERID(name)=CB:${CALLERID(name)})
exten => s,n,Goto(default,${MTARGET},btrans)
exten => s,n,Hangup

;自局桁数取得
[get-mydigits]
exten => s,1,NoOp(自局桁数取得)
exten => s,n,Set(MDIGI=${DB(ABS/MDIGITS)})
exten => s,n,GotoIf($["${MDIGI}"=""]?setdef)
exten => s,n,Goto(backn)
exten => s,n(setdef),Set(MDIGI=10)
exten => s,n(backn),Return

;複数サブルーチン実行用
;引数はcontext,extenの順。Priorityは1固定
[multi-subs]
exten => s,1,NoOp(マルチサブルーチン)
exten => s,n,Set(TMPI=1)
exten => s,n(lp1),Set(TARG=ARG${TMPI})
exten => s,n,Set(TSUBR=${${TARG}})
exten => s,n,GotoIf($["${TSUBR}"=""]?backm)
exten => s,n,Set(TMPI=$[${TMPI}+1])
exten => s,n,Set(TARG=ARG${TMPI})
exten => s,n,Set(TMACAG1=${${TARG}})
exten => s,n,GotoIf($["${TMACAG1}"=""]?backm)
exten => s,n,Gosub(${TSUBR},${TMACAG1},1)
exten => s,n,Set(TMPI=$[${TMPI}+1])
exten => s,n,Goto(lp1)
exten => s,n(backm),Return(0)

;時間外・休日チェック
[tc-check]
;時間外制御チェック
exten => _X.,1,NoOp(時間外制御チェック)
exten => _X.,n,Set(TCC=${DB(ABS/TCC)})
;強制設定されているかどうかチェック
exten => _X.,n,GotoIf($["${TCC}"="3"]?tcaonly,s,1)
exten => _X.,n,GotoIf($["${TCC}"="4"]?tcvm,s,1)
exten => _X.,n,GotoIf($["${TCC}"="6"]?ivrmenu,${EXTEN},1)
;時刻定義読出し
exten => _X.,n,Set(TSPEC=${DB(ABS/TCSPEC)})
exten => _X.,n,NoOp(時間定義:${TSPEC})
;時間定義が行われていなければ休日チェックへ
exten => _X.,n,GotoIf($["${TSPEC}"=""]?hlcheck)
;時間定義がある場合には休日チェックへ
exten => _X.,n,GotoIfTime(${TSPEC}?hlcheck)
exten => _X.,n,GotoIf($["${TCC}"="1"]?tcaonly,s,1)
exten => _X.,n,GotoIf($["${TCC}"="2"]?tcvm,s,1)
exten => _X.,n,GotoIf($["${TCC}"="5"]?ivrmenu,${EXTEN},1)
;上記条件でなければ祝日・休日チェック
exten => _X.,n(hlcheck),NoOp
exten => _X.,n,GotoIf($["${THS}"="1"]?backm)
;変数 HOLIDAY に値が入る(なければ通常)
exten => _X.,n,GoSub(sub-CHKHOLIDAY,s,1)
exten => _X.,n,GotoIf($["${HOLIDAY}"=""]?backm)
exten => _X.,n,Set(TCHC=${DB(ABS/TCHC)})
exten => _X.,n,GotoIf($["${TCHC}"="1"]?tcaonly,s,1)
exten => _X.,n,GotoIf($["${TCHC}"="2"]?tcvm,s,1)
;条件にあわなければ通常処理
exten => _X.,n(backm),Return


;Experimental
;メッセージングサポート
;内線間送信
[msgredir]
exten => s,1,NoOp(メッセージ送信-中継)
exten => s,n,NoOp(${MESSAGE(from)})
;Toの中身取り出し
exten => s,n,Set(TTO=${MESSAGE(to)})
exten => s,n,Set(DSTB=${CUT(TTO,@,2)})
;Fromは内線番号を表示させたいので内線情報取得
exten => s,n,Set(SRCX=${CUT(MESSAGE(from),:,2)})
exten => s,n,Set(ENDPOINT=${CUT(SRCX,@,1)})
exten => s,n,Gosub(sub-endpoint2ext,s,1)
exten => s,n,Set(MFROM=${EXT})
exten => s,n,Set(EXT=${MTARGET})
exten => s,n,Gosub(sub-ext2endpoint,s,1)
;エンドポイントが取得できない場合は内線登録なし
exten => s,n,GotoIf($["${ENDPOINT}"=""]?nogo)
;エンドポイント名がGで始まればグループ
exten => s,n,GotoIf($[${ENDPOINT:0:1}=G]?msg-grp,s,1)
;単独送信
;MESSAGE(to)を内線番号ではなくエンドポイントにセットしなおす
exten => s,n,Set(ENDPNAME=${CUT(sENDPOINT,/,2)})
exten => s,n,Set(DSTT=sip:${ENDPNAME}@${DSTB})
exten => s,n,MessageSend(pjsip:${ENDPNAME},${MFROM},${DSTT})
exten => s,n(nogo),Hangup

;グループ内メッセージ送信
[msg-grp]
exten => s,1,NoOp(メッセージ-グループ送信)
exten => s,n,Set(MGNUM=${ENDPOINT:1})
;要素取得
exten => s,n,Set(MGLIST=${DB_KEYCOUNT(ABS/GRP/${MGNUM})})
;元の発信内線
exten => s,n,Set(OFROM=${MFROM})
;メッセージ本体に元の内線番号と名前を付加
exten => s,n,Set(ONAME=${DB(cidname/${OFROM})})
exten => s,n,Set(MESSAGE(body)=${ONAME}(${OFROM}) : ${MESSAGE(body)})
;Fromはグループの番号を使う
exten => s,n,Set(MFROM=${DB(ABS/GRP/${MGNUM}/EXT)})
exten => s,n,GotoIf($["${MFROM}"=""]?nogo)
exten => s,n,Set(MGCNT=1)
;以下各要素をループ処理
exten => s,n(lp1),NoOp
exten => s,n,Set(GMLIST=${DB(ABS/GRP/${MGNUM})})
exten => s,n,Set(TMPTE=${CUT(GMLIST,\,,${MGCNT})})
exten => s,n,GotoIf($["${TMPTE}"=""]?nogo)
;自分宛てには送信しない
exten => s,n,GotoIf($[${TMPTE}=${OFROM}]?notg)
exten => s,n,Set(EXT=${TMPTE})
exten => s,n,Gosub(sub-ext2endpoint,s,1)
exten => s,n,GotoIf($["${ENDPOINT}"=""]?notg)
;MESSAGE(to)を内線番号ではなくエンドポイントにセットしなおす
exten => s,n,Set(ENDPNAME=${CUT(sENDPOINT,/,2)})
exten => s,n,Set(DSTT=sip:${ENDPNAME}@${DSTB})
exten => s,n,MessageSend(pjsip:${ENDPNAME},${MFROM},${DSTT})
exten => s,n(notg),Set(MGCNT=${INC(MGCNT)})
exten => s,n,Goto(lp1)
exten => s,n(nogo),Hangup

;ABSからの一方的送信
;ARG1-target endpoint ARG2-message body
[sendmsg]
exten => s,1,NoOp(メッセージ送信)
exten => s,n,GotoIf($["${ARG1}"=""]?nodo)
exten => s,n,GotoIf($["${ARG2}"=""]?nodo)
exten => s,n,Set(MESSAGE(body)=${ARG2})
exten => s,n,Set(MYDOMAIN=192.168.254.234)
exten => s,n,Set(MYFROM=ABS-PBX)
exten => s,n,MessageSend(pjsip:${ARG1},${MYFROM},sip:${ARG1}@${MYDOMAIN})
exten => s,n(nodo),Return

;ゴミ箱内線
[trashbin]
exten => s,1,NoOp(ゴミ箱内線処理)
;滞留防止
exten => s,n,Set(TIMEOUT(absolute)=60)
exten => s,n,Set(TMPID=${CHANNEL(LINKEDID)})
exten => s,n,Set(TNUM=${CALLERID(num)})
exten => s,n,Set(TP1=${DB(ABS/EXT/${TNUM})})
;内線登録のある番号はブロック対象としない(あたりまえ)
exten => s,n,GotoIf($["${TP1}"!=""]?nogo)
exten => s,n,Set(TARGET=${DB(ABS/LSTO/${TMPID}/CIDN)})
exten => s,n,GotoIf($["${TARGET}"=""]?nogo)
;
exten => s,n,Set(NOWDT=${STRFTIME(${EPOCH},,%Y-%m-%d/%H:%M:%S)})
exten => s,n,Set(DB(ABS/blocklist/${TARGET})=${NOWDT})
exten => s,n,MusicOnHold(default)
exten => s,n,Hangup
;実行しない場合の切断
exten => s,n(nogo),Hangup
exten => h,1,Hangup
;タイムアウト切断
exten => t,1,Hangup

;一時ストレージ削除ハンドラ
[delsto-afthang]
exten => s,1,NoOp(DELSTO:${ARG1})
exten => s,n,DBdeltree(ABS/LSTO/${ARG1})
exten => s,n,Return

;ログ処理ルーチン
;着信ログなどを別な手段にする場合にはここへ
;現在想定しているのはINCOMINGとBLOCKEDのみ
;書き方はここを参照
; ARG1 = KIND
; ARG2 = 番号
; ARG3 = UNIQUID
[record-log]
exten => s,1,NoOp(ログ:${ARG1})
exten => s,n,GotoIf($["${ARG1}"="INCOMING"]?dolog)
exten => s,n,GotoIf($["${ARG1}"="BLOCKED"]?dolog)
exten => s,n,Goto(backm)
;ログ実行
exten => s,n(dolog),NoOp
exten => s,n,Set(DBF=/var/log/asterisk/abslog.sqlite3)
exten => s,n,Set(SQL="INSERT INTO abslog(KIND,NUMBER,DESTNUM,UNIQID) values('${ARG1}','${ARG2}','${ARG3}','${ARG4}')")
exten => s,n,System(echo ${SQL} | sqlite3 ${DBF} > /dev/null 2>&1 )
;
exten => s,n(backm),Return

[create-logdb]
exten => s,1,NoOp(ログ用DB生成)
exten => s,n,System(/usr/sbin/logrotate -s /var/log/asterisk/logrotate.status /etc/asterisk/scripts/dbrotate.conf > /dev/null 2>&1)
exten => s,n,Set(DBF=/var/log/asterisk/abslog.sqlite3)
exten => s,n,Set(SQL="CREATE TABLE abslog (ID INTEGER PRIMARY KEY AUTOINCREMENT, KIND TEXT, NUMBER TEXT, DESTNUM TEXT, UNIQID TEXT, TIMESTAMP TIMESTAMP DEFAULT (DATETIME('now','localtime')))")
exten => s,n,System(echo ${SQL} | sqlite3 ${DBF} >> /tmp/absrot.log 2>&1 )
exten => s,n,Hangup

;ページング時のチャイム例
[sub-chimeup]
exten => s,1,Wait(1)
exten => s,n,Playtones(!523/300,!659/300,!783/300,!1046/300)
exten => s,n,Wait(2)
exten => s,n,Return
;ページング終了時例
;終了時はF()オプションでここへ転送されるのでHangupで終了すること
[sub-chimedown]
exten => s,1,Answer
exten => s,n,Wait(1)
exten => s,n,Playtones(!1046/300,!783/300,!659/300,!523/300)
exten => s,n,Wait(2)
exten => s,n,Hangup

;
; 無線機接続エンドポイントかのチェック
; TENDPOINT:ダイヤル先エンドポイント
;
[sub-radiocheck]
exten => s,1,NoOp(無線機ゲートウェイチェック)
exten => s,n,Set(RADIOGW=)
exten => s,n,Set(RLIST=${DB(ABS/RADIOGW)})
exten => s,n,Set(TMP1=1)
exten => s,n(lp1),NoOp
exten => s,n,Set(GWENDP=${CUT(RLIST,\,,${TMP1})})
exten => s,n,GotoIf($["${GWENDP}"=""]?ret)
exten => s,n,Set(TMPTE=${CUT(GWENDP,:,1)})
exten => s,n,GotoIf($["${sENDPOINT}"="${TMPTE}"]?isgw)
exten => s,n,Set(TMP1=${INC(TMP1)})
exten => s,n,Goto(lp1)
exten => s,n(isgw),Set(RADIOGW=YES)
exten => s,n(ret),NoOp
exten => s,n,Return

;
; 無線機接続時のPTT制御
; ARG1:ON/OFF/ALT
; GWENDP:ゲートウェイのエンドポイント名(注:__でメインのダイヤルプランで指定)
; 無線機ゲートウェイのIPアドレスはエンドポイントから求める
;
[sub-pttctl]
exten => s,1,NoOp(PTT制御)
exten => s,n,Set(TARGET=${GWENDP})
exten => s,n,Set(GWPORT=${CUT(GWENDP,:,2)})
exten => s,n,Set(RCONTACT=${CUT(GWENDP,:,1)})
exten => s,n,Set(RCONTACT=${CUT(RCONTACT,/,2)})
exten => s,n,Set(GWIP1=${PJSIP_DIAL_CONTACTS(${RCONTACT})})
exten => s,n,Set(GWIP1=${CUT(GWIP1,@,2)})
exten => s,n,Set(GWIP1=${CUT(GWIP1,:,1)})
exten => s,n,System(echo ${ARG1} | /usr/bin/nc ${GWIP1} ${GWPORT})
exten => s,n,Morsecode(E)
exten => s,n(ret),Return

;
; 内線hint生成処理
;
[sub-exthintgen]
exten => s,1,NoOp(内線hint生成)
;デバッグ用
;exten => s,n,Set(HINTFILE=/etc/asterisk/hinttest.conf)
;本番用
exten => s,n,Set(HINTFILE=/etc/asterisk/extensions_exthints.conf)
exten => s,n,Set(MAXEXT=64)
exten => s,n,Set(TMP=1)
;コメント行で内容削除
exten => s,n,System(echo "\; Auto generated hints" > ${HINTFILE})
exten => s,n,System(echo "[ext-hints]" >> ${HINTFILE})
exten => s,n(lp1),NoOp(${TMP1})
exten => s,n,Set(TMP_EXT=${DB(ABS/ERV/PJSIP/phone${TMP})})
exten => s,n,GotoIf($["${TMP_EXT}"=""]?cont)
;内線登録があればhint書き出し
exten => s,n,System(echo "exten => ${TMP_EXT},hint,PJSIP/phone${TMP}" >> ${HINTFILE})
exten => s,n(cont),Set(TMP=${INC(TMP)})
exten => s,n,GotoIf($[${TMP}>${MAXEXT}]?end)
exten => s,n,Goto(lp1)
;生成完了したらリロード
exten => s,n(end),System(asterisk -rx 'dialplan reload')
exten => s,n,Hangup

;
; Websocket内線生成処理
;
[sub-wsp-gen]
exten => s,1,NoOp(内線hint生成)
;デバッグ用
;exten => s,n,Set(CONFFILE=/etc/asterisk/websocket_client_test.conf)
;本番用
exten => s,n,Set(CONFFILE=/etc/asterisk/websocket_client.conf)
exten => s,n,Set(MAXEXT=32)
exten => s,n,Set(TMP=1)
;コメント行で内容削除
exten => s,n,System(echo "\; Auto generated conf -DO NOT EDIT-" > ${CONFFILE})
exten => s,n,Set(EPREFIX=${DB(ABS/WSP/EPFX)})
exten => s,n,GotoIf($["${EPREFIX}"=""]?dne)
exten => s,n,Set(EURI=${DB(ABS/WSP/URI)})
exten => s,n,GotoIf($["${EURI}"=""]?dne)
exten => s,n(lp1),NoOp(${TMP1})
exten => s,n,Set(SLOT=WSP${SPRINTF(%02d,${TMP})})
exten => s,n,Set(TMP_EXT=${DB(ABS/WSP/MAP/${SLOT})})
exten => s,n,GotoIf($["${TMP_EXT}"=""]?cont)
;内線登録があれば設定書き出し
exten => s,n,System(echo "[${EPREFIX}${TMP_EXT}]" >> ${CONFFILE})
exten => s,n,System(echo "type = websocket_client" >> ${CONFFILE})
exten => s,n,System(echo "uri = ${EURI}" >> ${CONFFILE})
exten => s,n,System(echo "protocols = media" >> ${CONFFILE})
exten => s,n,System(echo "connection_type = per_call_config" >> ${CONFFILE})
exten => s,n,System(echo "connection_timeout = 500" >> ${CONFFILE})
exten => s,n,System(echo "reconnect_interval = 500" >> ${CONFFILE})
exten => s,n,System(echo "reconnect_attempts = 5" >> ${CONFFILE})
exten => s,n,System(echo "tls_enabled = no" >> ${CONFFILE})
exten => s,n,System(echo "" >> ${CONFFILE})
;WebUIからの設定は"仮打ち"としてここで内線ベースで登録しなおす
;正引き側登録
exten => s,n,Set(DB(ABS/EXT/${TMP_EXT})=WEBSOCKET/${EPREFIX}${TMP_EXT})
;逆引き用のエンドポイントとしてconnection-idを登録する
exten => s,n,Set(DB(ABS/ERV/WEBSOCKET/${EPREFIX}${TMP_EXT})=${TMP_EXT})
;規制情報を登録する
exten => s,n,Set(TMP_LIMIT=${DB(ABS/WSP/MAP/${SLOT}/LIMIT)})
exten => s,n,Set(DB(ABS/LMT/WEBSOCKET/${EPREFIX}${TMP_EXT})=${TMP_LIMIT})
exten => s,n(cont),Set(TMP=${INC(TMP)})
exten => s,n,GotoIf($[${TMP}>${MAXEXT}]?end)
exten => s,n,Goto(lp1)
;生成完了したらモジュールリロード
exten => s,n(end),System(asterisk -rx 'module reload res_websocket_client.so')
exten => s,n(dne),Hangup

;
;外部通知チェック(ANSWER時の通知有無チェック)
;
[sub-notify-check]
exten => s,1,NoOp(外部通知チェック)
;通知がANSWERに指定されていなければ何もしない
exten => s,n,GotoIf($["${DB(ABS/CTI/POS)}"!="ANSWER"]?nonotify)
;ARG1が空なら内線でのグループ呼び出し
exten => s,n,GotoIf($["${ARG1}"=""]?nonotify)
;ARG2がGRPならグループなので応答した内線をチェック
exten => s,n,GotoIf($["${ARG2}"!="GRP"]?nogrp)
;チャネル名から応答したエンドポイント取り出し(グループ時)
exten => s,n,Set(TMP_EP=${CHANNEL(name)})
exten => s,n,Set(TMP_EP=${CUT(TMP_EP,/,2)})
;Websocket内線時分岐
exten => s,n,Set(WSPFX=${DB(ABS/WSP/EPFX)})
exten => s,n,Set(TLEN=${LEN(${WSPFX})})
exten => s,n,Set(TEPFX=${TMP_EP:0:${TLEN}})
exten => s,n,GotoIf($["${WSPFX}"="${TEPFX}"]?isws)
exten => s,n,Set(ENDPOINT=${CUT(TMP_EP,-,1)})
exten => s,n,Goto(cont)
exten => s,n(isws),Set(ENDPOINT=WEBSOCKET/${TMP_EP})
exten => s,n(cont),Gosub(sub-endpoint2ext,s,1)
exten => s,n,GotoIf($["${EXT}"=""]?nonotify)
;通知送信処理
exten => s,n(nogrp),GoSub(external-notify,s,1(${ARG1},${EXT}))
exten => s,n(nonotify),Return

[sub-add-jitterbuffer]
exten => s,1,NoOp(Adding Jitter Buffer)
exten => s,n,Set(JITTERBUFFER(fixed)=200:1000:60)
exten => s,n,Return

[sub-testnode]
exten => s,1(loop1),NoOp
exten => s,n,Answer()
exten => s,n,MusicOnHold()
exten => s,n,Goto(loop1)


[sub-sendtone]
exten => s,1,NoOp(Send Tone)
exten => s,n,SendSF(222,600,PJSIP/phone1-0000005)
exten => s,n,Hangup

;着信音選択用サブルーチン
