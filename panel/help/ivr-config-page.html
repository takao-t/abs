<p>
簡易IVRの設定を行います。
</p>
<h4>IVR処理番号設定</h4>
<p>
ある番号に着信した処理をIVRに回すか特定のアプリケーションに回すかを設定します。ダイレクトを指定すると着信を特定の処理を行わせることができます。
</p>
<h4>IVRメニュー項目設定</h4>
<p>
IVR処理時のメニューを設定します。IVRで使用できるトーンは1桁のみです。
</p>
<h4>その他設定</h4>
<p>
セーフティータイマ: 回線断を検出できない場合に回線を掴んだままになることを防ぎます。<br>
メニュー音声録音PIN: IVRのメニュー音声を録音する際のPINを設定します。
</p>
