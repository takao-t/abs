<p>
着信記録の管理を行います。初めて使用する場合にはログ・ローテーション実行を行ってください(ページの下方にあります)。この記録はAsteriskのCDRとは異なり、独自の記録を行っています。
</p>
<h4>記録表示</h4>
<p>
記録されたログを表示します。どの世代の記録を参照するかを指定し [変更] をクリックしてから、[着信履歴表示] または [着信拒否履歴表示] をクリックします。
</p>
<h4>記録の概要</h4>
<p>
現在記録されているログの一覧です。9世代まで保存されます。
</p>
<h4>記録設定</h4>
<p>
着信記録、着信拒否記録を行うかどうかを設定します。
</p>
<h4>ログ・ローテーションの実行</h4>
<p>
ログをローテーションし、世代を切り替えます。
</p>
