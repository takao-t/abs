<p>
短縮ダイヤル設定。交換機側のいわゆるクイックダイヤルです。000～299までの番号を割り当てることができます。ダイヤルする場合は *000～*299 を使用します。
</p>
<h4>プレフィクス設定</h4>
<p>
クイックダイヤル発信時に使用するプレフィクスを設定します。
</p>
<h4>短縮ダイヤル追加</h4>
<p>
短縮番号と発信する電話番号を登録します。電話番号は通常の電話番号を登録し、発信用プレフィクス等は付加しないでください。発信用プレフィクスは「プレフィクス設定」で行います。
</p>
<h4>登録済み一覧</h4>
<p>
登録されている短縮ダイヤルの一覧です。右のボタンから編集と削除が行えます。
</p>
